# wawona.io secret *names* only (public repo).
# Values live in the private pass store (same vault as Wawona):
#   https://github.com/aspauldingcode/.password-store
#   sandbox: secretspec/wawona/site/sandbox/<KEY> then secretspec/shared/default/<KEY>
#   live:    secretspec/wawona/site/live/<KEY>
# Local serve always sandbox. Pages always live. See docs/secrets.md.
#
# SecretSpec 0.10 on this host only knows global aliases `pass` and `shared`
# (pass://secretspec/shared/{profile}/{key}) plus URI providers (`env://`).
# CI: SECRETSPEC_PROVIDER=env://  (GitHub Actions secrets → env → Zola get_env).
# Never commit sk_/rk_. GitHub Pages never receives STRIPE_SECRET_KEY.

[project]
name = "wawona-io"
revision = "1.0"
require_reason = false

[providers]
pass = "pass://secretspec/shared/{profile}/{key}"

[profiles.default]
STRIPE_SECRET_KEY = { description = "Stripe secret or restricted key (sk_/rk_) for Checkout Sessions: never commit", providers = ["pass"], required = false }
STRIPE_PUBLISHABLE_KEY = { description = "Publishable key: pk_test_ locally, pk_live_ on Pages", providers = ["pass"], required = false }
STRIPE_CHECKOUT_API = { description = "Checkout Session API origin. Local is :4242. Pages must be https", providers = ["pass"], required = false }
STRIPE_CHECKOUT_ORIGINS = { description = "Comma-separated CORS origins allowed by stripe/server.py", providers = ["pass"], required = false }
SURVEY_DASHBOARD_TOKEN = { description = "Bearer/query token for /survey/stats and /survey/dashboard: never in Zola or Pages", providers = ["pass"], required = false }

# GitHub Pages build: env only. Never STRIPE_SECRET_KEY: static hosting cannot keep it.
[profiles.ci]
STRIPE_PUBLISHABLE_KEY = { description = "Live pk_live_ only. Injected into Zola via get_env", required = false }
STRIPE_CHECKOUT_API = { description = "Live https Checkout API. Injected as data-checkout-api", required = false }
