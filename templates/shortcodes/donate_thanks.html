<style>
    .dn-thanks-page {
        --dn-r: 24px;
        --dn-pad: 12px;
        --dn-r-in: 12px;
        max-width: 720px;
        margin: 0 auto;
        padding: 0 0 2rem;
    }

    body:has(.dn-thanks-page) .page-header {
        display: none;
    }

    .dn-thanks-card {
        background: var(--bg-1);
        border: 1px solid var(--border-color);
        border-radius: var(--dn-r);
        padding: var(--dn-pad);
        position: relative;
        overflow: hidden;
    }

    .dn-thanks-title {
        position: relative;
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
        letter-spacing: -0.03em;
        color: var(--text-0);
    }

    .dn-thanks-copy {
        position: relative;
        color: var(--text-1);
        margin: 0 0 1rem;
        line-height: 1.6;
    }

    .dn-thanks-actions {
        position: relative;
        display: grid;
        grid-template-columns: 1fr;
        gap: 0.55rem;
        margin-top: 1.25rem;
    }

    .dn-thanks-actions a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.6rem 1.25rem;
        border-radius: var(--dn-r-in);
        font-weight: 700;
        font-size: 0.95rem;
        text-align: center;
        text-decoration: none !important;
        box-sizing: border-box;
    }

    .dn-thanks-go {
        background: var(--primary-color);
        color: #fff !important;
    }

    .dn-thanks-next {
        background: var(--bg-2);
        color: var(--text-0) !important;
    }
</style>

<div class="dn-thanks-page" id="donate-thanks-page">
    <div class="dn-thanks-card">
        <h1 class="dn-thanks-title">Thanks.</h1>
        <p class="dn-thanks-copy" data-thanks-copy>That keeps Wawona in development.</p>
        <div class="dn-thanks-actions">
            <a class="dn-thanks-go" data-thanks-primary href="/donate/#manage">Manage or cancel</a>
            <a class="dn-thanks-next" data-thanks-secondary href="/donate/">Back to donate</a>
        </div>
    </div>
</div>

<script>
    (function initDonateThanks() {
        var page = document.getElementById("donate-thanks-page");
        if (!page) return;

        var params = new URLSearchParams(window.location.search || "");
        var fromDownload = params.get("from") === "download";
        var primary = page.querySelector("[data-thanks-primary]");
        var secondary = page.querySelector("[data-thanks-secondary]");
        if (fromDownload) {
            if (primary) {
                primary.href = "/download/";
                primary.textContent = "Continue to downloads";
            }
            if (secondary) {
                secondary.href = "/donate/#manage";
                secondary.textContent = "Manage or cancel";
            }
        }
    })();
</script>
