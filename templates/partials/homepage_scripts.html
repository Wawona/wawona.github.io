<script>
    // === GitHub Releases ===
    function isCalVerTag(tag) {
        return /^v\d{2}\.\d{1,2}\.\d{1,2}$/.test(tag || '');
    }

    function setHeroVersion(release) {
        const el = document.getElementById('lpHeroVersion');
        if (!el || !release) return;
        const tag = release.tag_name || '';
        if (!tag) return;
        el.textContent = tag.charAt(0) === 'v' ? tag : 'v' + tag;
        if (release.html_url) el.setAttribute('href', release.html_url);
        fitHeroPill();
    }

    /* Keep the version / Open source / MIT pill inline until it actually
       overflows the hero — no early fixed-width media breakpoint. */
    function fitHeroPill() {
        const pill = document.querySelector('.lp-hero-kicker .lp-hero-pill');
        if (!pill) return;
        const host = pill.parentElement;
        if (!host) return;
        pill.classList.remove('lp-hero-pill--stack');
        /* Force layout in pill mode, then compare intrinsic width to host. */
        const needsStack = pill.scrollWidth > host.clientWidth + 0.5;
        pill.classList.toggle('lp-hero-pill--stack', needsStack);
    }

    function initHeroPill() {
        fitHeroPill();
        const host = document.querySelector('.lp-hero-kicker');
        if (!host || typeof ResizeObserver === 'undefined') {
            window.addEventListener('resize', fitHeroPill, { passive: true });
            return;
        }
        if (host._lpPillObs) return;
        host._lpPillObs = new ResizeObserver(function () {
            fitHeroPill();
        });
        host._lpPillObs.observe(host);
    }

    async function fetchReleases() {
        const c = document.getElementById('releases-list');
        try {
            const r = await fetch('https://api.github.com/repos/Wawona/Wawona/releases?per_page=10', {
                headers: { Accept: 'application/vnd.github+json' }
            });
            if (!r.ok) throw 0;
            const d = await r.json();
            const published = d.filter(x => x && !x.draft && !x.prerelease);
            const latest = published.find(x => isCalVerTag(x.tag_name)) || published[0];
            setHeroVersion(latest);
            if (!c) return;
            if (!published.length) { c.innerHTML = '<p class="lp-empty">No releases yet.</p>'; return; }
            c.innerHTML = published.slice(0, 3).map(x => {
                const n = x.name || x.tag_name, t = new Date(x.published_at).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
                return `<a href="${x.html_url}" target="_blank" rel="noopener" class="lp-col-item"><span>${n} <code>${x.tag_name}</code></span><time>${t}</time></a>`;
            }).join('');
        } catch (e) {
            if (c) c.innerHTML = '<div class="lp-empty"><p>Could not load releases.</p><a href="https://github.com/Wawona/Wawona/releases" target="_blank">View on GitHub &rarr;</a></div>';
        }
    }

    // === Screenshot Carousel ===
    function initShowcase() {
        const track = document.getElementById('showcaseTrack'), dots = document.querySelectorAll('.lp-showcase-dot'), title = document.getElementById('showcaseBarTitle');
        if (!track || !dots.length) return;
        let cur = 0; const slides = track.querySelectorAll('.lp-showcase-slide'), total = slides.length;
        let interval;
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        function setTitle(text) {
            if (!title || title.textContent === text) return;
            if (reduceMotion) {
                title.textContent = text;
                return;
            }
            title.classList.add('is-fading');
            window.setTimeout(function () {
                title.textContent = text;
                title.classList.remove('is-fading');
            }, 180);
        }

        function go(i) {
            if (i === cur) return;
            slides[cur].classList.remove('active');
            dots[cur].classList.remove('active');
            cur = i;
            slides[cur].classList.add('active');
            dots[cur].classList.add('active');
            setTitle(slides[cur].dataset.title);
        }

        function startAuto() {
            clearInterval(interval);
            interval = setInterval(() => go((cur + 1) % total), reduceMotion ? 7000 : 6500);
        }

        function manualGo(i) {
            go(i);
            startAuto();
        }

        dots.forEach(d => d.addEventListener('click', () => manualGo(+d.dataset.index)));
        startAuto();

        // Mouse/Swipe Support
        let startPosX = 0;
        let isDragging = false;

        track.addEventListener('mousedown', e => {
            e.preventDefault(); // Prevent native image drag
            startPosX = e.clientX;
            isDragging = true;
        });

        window.addEventListener('mousemove', e => {
            if (!isDragging) return;
            // Prevent text selection while dragging
            e.preventDefault();
        });

        window.addEventListener('mouseup', e => {
            if (!isDragging) return;
            const endPosX = e.clientX;
            const diff = startPosX - endPosX;

            if (Math.abs(diff) > 50) {
                if (diff > 0) manualGo((cur + 1) % total);
                else manualGo((cur - 1 + total) % total);
            }

            isDragging = false;
        });

        // Mobile Swipe Support
        let tsX = 0;
        track.addEventListener('touchstart', e => {
            tsX = e.touches[0].clientX;
        }, { passive: true });

        track.addEventListener('touchend', e => {
            const teX = e.changedTouches[0].clientX;
            const diff = tsX - teX;
            if (Math.abs(diff) > 40) {
                if (diff > 0) manualGo((cur + 1) % total);
                else manualGo((cur - 1 + total) % total);
            }
        }, { passive: true });
    }

    // === Scroll Reveal (Framer Motion-style) ===
    function initReveal() {
        const items = document.querySelectorAll('.lp-reveal');
        if (!items.length) return;
        const ob = new IntersectionObserver(entries => {
            entries.forEach(e => {
                if (!e.isIntersecting) return;
                const ch = e.target.querySelectorAll('.lp-feature-text,.lp-feature-visual,.lp-col-card,.lp-platform,.lp-arch-chip,.lp-stat,.lp-points p');
                ch.forEach((c, j) => {
                    c.style.transitionDelay = `${j * 0.09}s`;
                    c.classList.add('lp-revealed');
                    setTimeout(() => { c.style.transitionDelay = ''; }, 1000);
                });
                e.target.classList.add('lp-revealed');
                ob.unobserve(e.target);
            });
        }, { threshold: 0.06, rootMargin: '0px 0px -30px 0px' });
        items.forEach(el => ob.observe(el));
    }

    // === Parallax ===
    function initParallax() {
        const els = document.querySelectorAll('[data-parallax]');
        if (!els.length || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        let ticking = false;
        window.addEventListener('scroll', () => {
            if (ticking) return; ticking = true;
            requestAnimationFrame(() => {
                const sy = window.scrollY;
                els.forEach(el => {
                    const speed = parseFloat(el.dataset.parallax);
                    const rect = el.getBoundingClientRect();
                    const offset = (rect.top + sy - window.innerHeight / 2) * speed;
                    el.style.transform = `translateY(${-offset * 0.15}px)`;
                });
                ticking = false;
            });
        }, { passive: true });
    }

    // === Mouse Tracking ===
    function initMouseTrack() {
        if (window.innerWidth < 768 || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        const els = document.querySelectorAll('[data-mouse-track]');
        let mx = 0, my = 0, ticking = false;
        document.addEventListener('mousemove', e => {
            mx = (e.clientX / window.innerWidth - 0.5) * 2;
            my = (e.clientY / window.innerHeight - 0.5) * 2;
            if (ticking) return; ticking = true;
            requestAnimationFrame(() => {
                els.forEach(el => {
                    const s = parseFloat(el.dataset.mouseTrack);
                    el.style.transform = `translate3d(${mx * s}px, ${my * s}px, 0)`;
                });
                ticking = false;
            });
        }, { passive: true });
    }

    // === Init ===
    function lpInit() { fetchReleases(); initHeroPill(); initShowcase(); initReveal(); initParallax(); initMouseTrack(); }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', lpInit); else lpInit();
</script>

        display: flex;
        flex-direction: column;
        user-select: none;
        -webkit-user-select: none;
    }

    .lp-showcase-slide img {
        pointer-events: none;
        -webkit-user-drag: none;
        border-radius: 0;
    }

    /* Ambient top highlight edge */
    .lp-showcase-frame::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
        pointer-events: none;
        z-index: 10;
    }

    :root.dark .lp-showcase-frame {
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    :root.light .lp-showcase-frame {
        border: 1px solid rgba(0, 0, 0, 0.08);
    }

    .lp-showcase-bar {
        display: flex;
        align-items: center;
        gap: 0;
        /* Equal top/left inset so the traffic group clears the frame curve. */
        padding: var(--traffic-inset) 16px var(--traffic-inset) var(--traffic-inset);
        background: var(--bg-1);
        border-radius: var(--showcase-r) var(--showcase-r) 0 0;
        position: relative;
        z-index: 5;
        flex-shrink: 0;
        box-sizing: border-box;
    }

    .lp-showcase-traffic {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        flex: 0 0 auto;
        line-height: 0;
    }

    :root.dark {
        --bg-1-rgb: 30, 30, 35;
        --bg-2-rgb: 45, 45, 52;
        --primary-color-rgb: 239, 83, 80;
        --dot-inactive-bg: rgba(255, 255, 255, 0.4);
        --dot-hover-bg: rgba(255, 255, 255, 0.8);
        --dot-active-bg: #ffffff;
    }

    :root.light {
        --bg-1-rgb: 245, 245, 247;
        --bg-2-rgb: 235, 235, 240;
        --primary-color-rgb: 239, 83, 80;
        --dot-inactive-bg: rgba(0, 0, 0, 0.2);
        --dot-hover-bg: rgba(0, 0, 0, 0.4);
        --dot-active-bg: var(--primary-color);
    }

    .lp-dot-r,
    .lp-dot-y,
    .lp-dot-g {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2), inset 0 -1px 1px rgba(0, 0, 0, 0.1);
        position: relative;
        flex: 0 0 auto;
    }

    /* Subtle symbols on hover for traffic lights */
    .lp-dot-r::after,
    .lp-dot-y::after,
    .lp-dot-g::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        opacity: 0;
        transition: opacity 0.2s;
        background-position: center;
        background-repeat: no-repeat;
        background-size: 6px;
    }

    .lp-showcase-traffic:hover .lp-dot-r::after,
    .lp-showcase-traffic:hover .lp-dot-y::after,
    .lp-showcase-traffic:hover .lp-dot-g::after {
        opacity: 0.6;
    }

    .lp-dot-r {
        background: #ff5f57;
        border: 1px solid #e0443e;
    }

    .lp-dot-y {
        background: #febc2e;
        border: 1px solid #d89e24;
    }

    .lp-dot-g {
        background: #28c840;
        border: 1px solid #1fa732;
    }

    .lp-showcase-bar-title {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        font-size: .8rem;
        color: var(--text-0);
        font-weight: 500;
        font-family: var(--text-font);
        letter-spacing: 0.02em;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        /* Prevent wrapping and handle overflow */
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: calc(100% - 120px);
        text-align: center;
        transition: opacity 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .lp-showcase-bar-title.is-fading {
        opacity: 0;
    }

    @media (max-width: 540px) {
        .lp-dot-g {
            display: none;
        }
    }

    @media (max-width: 420px) {
        .lp-dot-y {
            display: none;
        }
    }

    .lp-showcase-track {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: minmax(0, auto);
        min-height: 200px;
        background: #000;
        /* Deep backdrop for images */
        flex: 1;
        border-radius: 0;
        isolation: isolate;
    }

    .lp-showcase-slide {
        grid-area: 1 / 1;
        width: 100%;
        height: 100%;
        position: relative;
        z-index: 0;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition:
            opacity 1.15s cubic-bezier(0.22, 1, 0.36, 1),
            visibility 1.15s linear;
    }

    .lp-showcase-slide.active {
        z-index: 1;
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
    }

    @media (prefers-reduced-motion: reduce) {
        .lp-showcase-slide {
            transition: none;
        }

        .lp-showcase-bar-title {
            transition: none;
        }
    }

    .lp-showcase-img-container {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    .lp-showcase-slide .next-image-wrapper {
        aspect-ratio: auto !important;
        /* Let the container/image define the shape */
        background-image: none !important;
        /* Hide LQIP if it forces a ratio */
        height: 100%;
        width: 100%;
        transform: none;
        border-radius: 0;
    }

    .lp-showcase-slide img,
    .lp-showcase-slide .next-image-target {
        width: 100%;
        height: 100%;
        max-height: 80vh;
        object-fit: contain !important;
        /* Ensure "fit" mode, never "fill" */
        display: block;
        margin: 0 auto;
        position: relative !important;
        /* Override absolute positioning from general styles if necessary */
        border-radius: 0;
    }

    /* === Gallery Footer Link === */
    .lp-showcase-footer {
        text-align: center;
        margin-top: 1.5rem;
    }

    .lp-showcase-footer a {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--text-2);
        text-decoration: none;
        transition: color 0.2s ease, gap 0.3s cubic-bezier(.16, 1, .3, 1);
        border-bottom: none !important;
    }

    @media (hover: hover) {
        .lp-showcase-footer a:hover {
            color: var(--primary-color) !important;
            gap: 0.7rem;
            background: transparent !important;
        }
    }

    .lp-showcase-nav {
        position: absolute;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        background: rgba(12, 12, 16, 0.82);
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4);
        z-index: 30;
        pointer-events: auto;
    }

    .lp-showcase-dot {
        width: 8px;
        height: 8px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.5);
        cursor: pointer;
        padding: 0;
        border: none;
        transition: all .3s cubic-bezier(0.25, 1, 0.5, 1);
    }

    @media (hover: hover) {
        .lp-showcase-dot:hover {
            background: rgba(255, 255, 255, 0.9);
        }
    }

    .lp-showcase-dot.active {
        width: 24px;
        background: #fff;
    }

    /* ===== POINTS (FOSS / App Store / Extensible) ===== */
    .lp-points-section {
        padding-top: 3rem;
        padding-bottom: 3rem;
        padding-left: 0.9rem;
        padding-right: 0.9rem;
    }

    .lp-points-section .lp-section-inner {
        max-width: var(--page-width, 920px);
        width: 100%;
        box-sizing: border-box;
    }

    .lp-points-section .lp-section-header {
        margin-bottom: 1.5rem;
        max-width: 100%;
    }

    .lp-points-section .lp-section-header p {
        max-width: 100%;
        overflow-wrap: break-word;
    }

    .lp-points {
        max-width: 100%;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: .7rem;
        text-align: left;
    }

    .lp-points p {
        margin: 0;
        font-size: .92rem;
        line-height: 1.55;
        color: var(--text-2);
    }

    .lp-points strong {
        color: var(--text-0);
        font-weight: 600;
    }

    /* ===== FEATURE ROWS ===== */
    .lp-feature-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 3rem;
        align-items: center;
        padding: 2.5rem 0;
    }

    .lp-feature-row+.lp-feature-row {
        border-top: 1px solid var(--border-color);
    }

    .lp-feature-row-reverse .lp-feature-text {
        order: 2;
    }

    .lp-feature-row-reverse .lp-feature-visual {
        order: 1;
    }

    .lp-feature-text h3 {
        font-size: 1.35rem;
        font-weight: 700;
        font-family: var(--header-font);
        letter-spacing: -.02em;
        margin: 0 0 .75rem;
    }

    .lp-feature-text p {
        font-size: .92rem;
        color: var(--text-2);
        line-height: 1.65;
        margin: 0;
    }

    .lp-code-block {
        background: var(--bg-0);
        border: 1px solid var(--border-color);
        border-radius: 10px;
        padding: 1.25rem 1.5rem;
        font-family: var(--mono-text-font);
        font-size: .82rem;
        line-height: 1.7;
        overflow-x: auto;
    }

    .lp-code-comment {
        color: var(--text-2);
    }

    .lp-code-kw {
        color: var(--primary-color);
        font-weight: 600;
    }

    .lp-code-fn {
        color: var(--text-0);
    }

    .lp-stat-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
    }

    .lp-stat {
        text-align: center;
        padding: 1.25rem;
        background: var(--bg-0);
        border: 1px solid var(--border-color);
        border-radius: 10px;
    }

    .lp-stat-num {
        display: block;
        font-size: 1.75rem;
        font-weight: 800;
        font-family: var(--header-font);
        color: var(--primary-color);
        letter-spacing: -.02em;
    }

    .lp-stat-label {
        display: block;
        font-size: .7rem;
        color: var(--text-2);
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: .06em;
        margin-top: .25rem;
    }

    /* ===== INSIDE (vertical architecture, no sideways scroll) ===== */
    .lp-inside {
        position: relative;
        padding: 4.5rem 1.5rem 5rem;
        background:
            radial-gradient(ellipse 72% 70% at 50% 0%,
                rgba(239, 83, 80, 0.18) 0%,
                transparent 62%),
            linear-gradient(160deg, #0d0d12 0%, #14141d 55%, #0f0f1a 100%);
        border-top: 1px solid rgba(239, 83, 80, 0.25);
        border-bottom: 1px solid rgba(239, 83, 80, 0.25);
    }

    :root.light .lp-inside {
        background:
            radial-gradient(ellipse 72% 70% at 50% 0%,
                rgba(239, 83, 80, 0.08) 0%,
                transparent 62%),
            linear-gradient(160deg, #f2f2f8 0%, #eaeaf2 50%, #f0f0f8 100%);
        border-top: 1px solid rgba(239, 83, 80, 0.15);
        border-bottom: 1px solid rgba(239, 83, 80, 0.15);
    }

    .lp-inside-inner {
        width: min(920px, 100%);
        margin: 0 auto;
    }

    .lp-inside-header {
        margin-bottom: 2rem;
    }

    .lp-inside .lp-arch-tag {
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        color: var(--primary-color);
        font-family: var(--mono-text-font);
        margin-bottom: 0.35rem;
    }

    .lp-inside .lp-arch-title {
        font-size: clamp(2.2rem, 6vw, 3.4rem);
        font-weight: 900;
        font-family: var(--header-font);
        margin: 0;
        letter-spacing: -0.04em;
        line-height: 1.05;
        color: #fff;
    }

    :root.light .lp-inside .lp-arch-title {
        color: var(--text-0);
    }

    .lp-inside-lead {
        margin: 0.75rem 0 0;
        font-size: 1.1rem;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.65);
    }

    :root.light .lp-inside-lead {
        color: var(--text-2);
    }

    .lp-stack {
        list-style: none;
        margin: 0 0 2rem;
        padding: 0.7rem;
        display: flex;
        flex-direction: column;
        gap: 0.55rem;
        background: rgba(20, 18, 26, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
    }

    :root.light .lp-stack {
        background: rgba(255, 255, 255, 0.7);
        border-color: rgba(0, 0, 0, 0.08);
    }

    .lp-stack-layer {
        display: grid;
        grid-template-columns: 7.5rem 1fr;
        grid-template-rows: auto auto;
        column-gap: 0.9rem;
        row-gap: 0.15rem;
        padding: 0.85rem 1rem;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
        transition: border-color 0.2s ease, background 0.2s ease;
    }

    .lp-stack-layer:hover,
    .lp-stack-layer:focus-within {
        border-color: rgba(239, 83, 80, 0.45);
        background: rgba(239, 83, 80, 0.08);
    }

    :root.light .lp-stack-layer {
        background: rgba(255, 255, 255, 0.9);
        border-color: rgba(0, 0, 0, 0.06);
    }

    :root.light .lp-stack-layer:hover,
    :root.light .lp-stack-layer:focus-within {
        border-color: rgba(239, 83, 80, 0.4);
        background: #fff;
    }

    .lp-stack-kicker {
        grid-row: 1 / span 2;
        align-self: center;
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-family: var(--mono-text-font);
        color: var(--primary-color);
    }

    .lp-stack-layer strong {
        font-size: 1rem;
        font-weight: 700;
        font-family: var(--header-font);
        color: #fff;
    }

    :root.light .lp-stack-layer strong {
        color: var(--text-0);
    }

    .lp-stack-note {
        font-size: 0.88rem;
        line-height: 1.4;
        color: rgba(255, 255, 255, 0.62);
    }

    :root.light .lp-stack-note {
        color: var(--text-2);
    }

    .lp-inside-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.85rem;
    }

    .lp-inside-card {
        margin: 0;
        padding: 1.25rem 1.35rem;
        border-radius: 20px;
        background: rgba(30, 28, 36, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    :root.light .lp-inside-card {
        background: rgba(255, 255, 255, 0.78);
        border-color: rgba(0, 0, 0, 0.08);
    }

    .lp-inside-card h3 {
        margin: 0 0 0.55rem;
        font-size: 1.2rem;
        font-weight: 800;
        font-family: var(--header-font);
        letter-spacing: -0.02em;
        color: #fff;
    }

    :root.light .lp-inside-card h3 {
        color: var(--text-0);
    }

    .lp-inside-card p {
        margin: 0;
        font-size: 0.95rem;
        line-height: 1.55;
        color: rgba(255, 255, 255, 0.7);
    }

    :root.light .lp-inside-card p {
        color: #3a3a4a;
    }

    .lp-inside-card code {
        font-family: var(--mono-text-font);
        font-size: 0.88em;
        color: var(--primary-color);
    }

    .lp-iland-link {
        color: inherit;
        text-decoration: none;
        border-bottom: none !important;
        border-radius: 6px;
    }

    .lp-iland-link:hover,
    .lp-iland-link:focus {
        color: var(--primary-color) !important;
        background: none !important;
        text-decoration: underline;
        text-underline-offset: 0.18em;
    }

    .lp-iland-link:hover code,
    .lp-iland-link:focus code {
        color: var(--primary-color) !important;
        background: transparent;
    }

    @media (max-width: 700px) {
        .lp-inside {
            padding: 3.25rem 1.15rem 3.75rem;
        }

        .lp-stack-layer {
            grid-template-columns: 1fr;
            gap: 0.2rem;
        }

        .lp-stack-kicker {
            grid-row: auto;
        }

        .lp-inside-grid {
            grid-template-columns: 1fr;
        }
    }

    @media (max-width: 768px) {
        .lp-feature-row {
            grid-template-columns: 1fr;
        }

        .lp-feature-row-reverse .lp-feature-text {
            order: unset;
        }

        .lp-feature-row-reverse .lp-feature-visual {
            order: unset;
        }

        .lp-stat-grid {
            grid-template-columns: 1fr;
        }

        .lp-platforms {
            gap: 1.25rem;
        }

        .lp-cta-links {
            flex-direction: column;
            align-items: center;
        }
    }

    .lp-arch-mini-row {
        display: flex;
        gap: .5rem;
    }

    .lp-arch-chip {
        padding: .6rem 1.2rem;
        background: var(--bg-0);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-size: .82rem;
        font-weight: 600;
        font-family: var(--header-font);
        transition: all .3s ease;
    }

    @media (hover: hover) {
        .lp-arch-chip:hover {
            border-color: var(--primary-color);
        }
    }

    .lp-arch-chip-core {
        border: 2px solid var(--primary-color);
        background: var(--bg-1);
        color: var(--primary-color);
    }

    .lp-arch-chip-dep {
        color: var(--text-2);
        font-weight: 500;
    }

    .lp-arch-mini-connector {
        font-size: .68rem;
        color: var(--text-2);
        font-family: var(--mono-text-font);
        padding: .5rem 0;
        position: relative;
    }

    .lp-arch-mini-connector::before,
    .lp-arch-mini-connector::after {
        content: '';
        display: block;
        width: 1px;
        height: 8px;
        background: var(--border-color);
        margin: 0 auto 2px;
    }

    .lp-arch-mini-connector::after {
        margin: 2px auto 0;
    }

    /* ===== ARCHITECTURE DIAGRAM (Hub & Spoke) ===== */
    .lp-arch-diagram {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
        padding: 2rem 1rem;
        width: 100%;
    }

    .lp-arch-hub {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: var(--bg-1);
        border: 2px solid #d89e24;
        color: #d89e24;
        box-shadow: 0 0 0 8px rgba(216, 158, 36, 0.1), 0 0 30px rgba(216, 158, 36, 0.15);
        animation: arch-pulse 3s ease-in-out infinite;
        text-align: center;
        gap: 0.15rem;
        flex-shrink: 0;
    }

    @keyframes arch-pulse {

        0%,
        100% {
            box-shadow: 0 0 0 8px rgba(216, 158, 36, 0.1), 0 0 30px rgba(216, 158, 36, 0.15);
        }

        50% {
            box-shadow: 0 0 0 14px rgba(216, 158, 36, 0.05), 0 0 50px rgba(216, 158, 36, 0.25);
        }
    }

    .lp-arch-hub-label {
        font-size: 0.7rem;
        font-weight: 800;
        font-family: var(--header-font);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        line-height: 1.2;
    }

    .lp-arch-hub-sub {
        font-size: 0.65rem;
        font-family: var(--mono-text-font);
        opacity: 0.7;
    }

    .lp-arch-spokes {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1rem;
        width: 100%;
        max-width: 340px;
    }

    .lp-arch-spoke {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
    }

    .lp-arch-line {
        width: 1px;
        height: 24px;
        background: linear-gradient(to bottom, #d89e24, var(--border-color));
        opacity: 0.6;
    }

    .lp-arch-chip {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.15rem;
        padding: 0.6rem 1rem;
        background: var(--bg-1);
        border: 1px solid var(--border-color);
        border-radius: 10px;
        font-size: 0.82rem;
        font-weight: 700;
        font-family: var(--header-font);
        transition: all 0.3s cubic-bezier(.16, 1, .3, 1);
        width: 100%;
        text-align: center;
    }

    @media (hover: hover) {
        .lp-arch-chip:hover {
            border-color: var(--primary-color);
            transform: translateY(-3px);
        }
    }

    .lp-arch-chip-name {
        color: var(--text-0);
    }

    .lp-arch-chip-bind {
        font-size: 0.65rem;
        font-family: var(--mono-text-font);
        color: var(--text-2);
        font-weight: 500;
    }

    /* ===== EXPLORE + CONTRIBUTE ===== */
    .lp-feed-section {
        padding-top: 3rem;
        padding-bottom: 3rem;
        padding-left: 0.9rem;
        padding-right: 0.9rem;
    }

    .lp-feed-section .lp-section-inner {
        max-width: var(--page-width, 920px);
        width: 100%;
        box-sizing: border-box;
    }

    .lp-feed-section .lp-section-header {
        margin-bottom: 1rem;
        max-width: 100%;
    }

    .lp-feed-section .lp-section-header p {
        max-width: 100%;
        overflow-wrap: break-word;
    }

    #releases-list + .lp-col-item {
        border-top: 1px solid var(--border-color);
    }

    .lp-explore {
        display: flex;
        flex-direction: row;
        flex-wrap: nowrap;
        align-items: center;
        justify-content: center;
