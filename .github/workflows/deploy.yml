# Workflow to build and deploy a Zola site to GitHub Pages
name: Deploy Zola site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0    # Fetch all history for git-related variables

      - name: Install Zola
        run: |
          # Fetch the latest Zola release or specify a version
          # Using 0.19.2 which is a stable recent version
          ZOLA_VERSION="0.19.2"
          curl -L https://github.com/getzola/zola/releases/download/v$ZOLA_VERSION/zola-v$ZOLA_VERSION-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv zola /usr/local/bin/

      - name: Assert live Stripe env
        env:
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_CHECKOUT_API: ${{ secrets.STRIPE_CHECKOUT_API }}
        run: bash ./scripts/assert-stripe-mode.sh live

      - name: Build
        env:
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_CHECKOUT_API: ${{ secrets.STRIPE_CHECKOUT_API }}
          STRIPE_MODE: live
          SECRETSPEC_PROFILE: ci
          SECRETSPEC_PROVIDER: env://
        run: zola build --output-dir ./public

      - name: Assert built site is live Checkout
        run: bash ./scripts/assert-stripe-mode.sh live-build ./public

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
