{% extends "page.html" %}

{% block main_content %}
    <main class="not-found-header">
        <h1 class="not-found-sr">404 Page not found</h1>
        <div class="lp-showcase-frame not-found-window">
            <div class="lp-showcase-bar">
                <div class="lp-showcase-traffic" aria-hidden="true">
                    <span class="lp-dot-r"></span>
                    <span class="lp-dot-y"></span>
                    <span class="lp-dot-g"></span>
                </div>
                <span class="lp-showcase-bar-title">404 Page not found</span>
            </div>
            <div class="lp-showcase-track not-found-window-body">
                <canvas class="not-found-cube" width="512" height="512" role="img"
                    aria-hidden="true"></canvas>
            </div>
        </div>
        <p class="not-found-fallback" data-not-found-fallback hidden>Page not found</p>
        <script type="module" src="{{ get_url(path='js/not-found-cube.js') }}"></script>
    </main>
{% endblock main_content %}
